[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zar-ritual"
version = "1.0.0"
description = "Minimal simulation of spirit identification in Hormozgan zar rituals"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Baselizadeh" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
zar-ritual = "zar_ritual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
